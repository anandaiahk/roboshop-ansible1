- name: configure the catalogue
  hosts: catalogue
  become: yes
  tasks:
  - name: enable node js 20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: install node js
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: create system user roboshop
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "Roboshop system user"

  - name: delete the app directtory
    ansible.builtin.file:
        path: /app
        state: absent    

  - name: create app directtory
    ansible.builtin.file:
      path: /app
      state: directory   

  - name: delete the zip directtory
    ansible.builtin.file:
        path: /tmp/catalogue.zip
        state: absent    
     

  - name: download catalogue
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip

  - name: unzip catalogue
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: install dependency
    community.general.npm:
      path: /app

  - name: copy the catalogue service
    ansible.builtin.copy:
      src: catalogue.service
      dest: /etc/systemd/system/catalogue.service

  - name: copy the mongo repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo   

  - name: install mongod client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  - name: catalogue products load or not
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'    
    register: catalogue_output

  - name: print the catalogue ec2_output
    ansible.builtin.debug:
      msg: "{{ catalogue_output }}"  

  - name: load the products
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout | int < 0    

  - name: start the catalogue service
    ansible.builtin.service:
      name: catalogue
      state: restart
      enabled: yes  



